services:
  - type: web
    name: cims
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npx prisma generate
    startCommand: node app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_MAX_AGE
        value: "86400000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DEFAULT_MENTOR_EMAIL
        value: mentor.cims@gmail.com
      - key: DEFAULT_MENTOR_PASSWORD
        value: Mentor123!
      - key: DEFAULT_MENTOR_NAME
        value: Admin Mentor
      - key: DEFAULT_MENTOR_PHONE
        value: "081234567890"
